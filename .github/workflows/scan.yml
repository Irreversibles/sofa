name: CF ASN IP Scanner

on:
  workflow_dispatch:
    inputs:
      target:
        description: '目标: ASN(如AS906)/网段/IP/文件(如ip.txt)'
        required: true
        default: 'AS13335'
      name_label:
        description: '名字 (如 DMIT)'
        required: true
        default: 'RESULT'
      ports:
        description: '端口(逗号分隔,留空用默认)'
        required: false
        default: '443,2053,2083,2096,8443'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download GeoIP Database
        run: |
          curl -L -o GeoLite2-Country.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb

      - name: Run Scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
          EDT_PATH: ${{ secrets.EDT_PATH }}
          EDT_KEYWORD: ${{ secrets.EDT_KEYWORD }}
        run: |
          python check_cf_asn.py "${{ github.event.inputs.target }}" "${{ github.event.inputs.name_label }}" "${{ github.event.inputs.ports }}"

      - name: Push result to private repo
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Irreversibles/proxyip.git result_repo
          cp *.txt result_repo/ 2>/dev/null || true
          cd result_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add *.txt
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "auto: update scan result"
            git push
          fi
