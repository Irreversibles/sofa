name: CF ASN IP Scanner

on:
  workflow_dispatch:
    inputs:
      asn_input:
        description: '输入 ASN 号(如AS906) 或 文件名(如ip.txt)'
        required: true
        default: 'AS13335'
      name_label:
        description: '输出名字/文件名 (如: DMIT)'
        required: true
        default: 'RESULT'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download GeoIP Database
        run: |
          curl -L -o GeoLite2-Country.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb

      - name: Run ASN Scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
        run: |
          python check_cf_asn.py "${{ github.event.inputs.asn_input }}" "${{ github.event.inputs.name_label }}"

      - name: Push result to private repo
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Irreversibles/proxyip.git result_repo
          cp *.txt result_repo/ 2>/dev/null || true
          cd result_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add *.txt
          git diff --staged --quiet && echo "无变化，跳过" || {
            git commit -m "auto: update scan result"
            git push
          }
