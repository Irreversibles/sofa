name: CF ASN IP Scanner

on:
  workflow_dispatch:
    inputs:
      target:
        description: '目标 ASN/网段/IP/文件 (如 906 或 906,32519)'
        required: true
        default: 'AS36002'
      name_label:
        description: '名字(填auto自动识别, 或手动填如DMIT)'
        required: false
        default: 'auto'
      ports:
        description: '端口(逗号分隔)'
        required: false
        default: '443,8443,2053,2083,2096'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download GeoIP Database
        run: |
          for i in 1 2 3; do
            curl -L --fail -o GeoLite2-Country.mmdb \
              https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb && break
            echo "retry $i..."; sleep 5
          done

      - name: Pull old results
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Irreversibles/proxyip.git result_repo
          cp result_repo/*.txt ./ 2>/dev/null || true

      - name: Run Scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
        run: |
          python check_cf_asn.py "${{ github.event.inputs.target }}" "${{ github.event.inputs.name_label }}" "${{ github.event.inputs.ports }}"

      - name: Push result to private repo
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          shopt -s nullglob
          for f in *.txt; do
            if [ "$f" != "ip.txt" ] && [ "$f" != "count.txt" ] && [ "$f" != "name.txt" ]; then
              cp "$f" result_repo/ 2>/dev/null || true
            fi
          done

          cd result_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "auto: update result"
            git pull --rebase
            git push
          fi

      - name: Notify TG
        if: always()
        run: |
          COUNT=$(cat count.txt 2>/dev/null || echo "?")
          NAME=$(cat name.txt 2>/dev/null || echo "${{ github.event.inputs.name_label }}")
          TARGET="${{ github.event.inputs.target }}"
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ 扫描完成%0A服务商: ${NAME}%0A目标: ${TARGET}%0A本次新增: ${COUNT} 个"
          else
            MSG="❌ 扫描失败%0A服务商: ${NAME}%0A目标: ${TARGET}%0A状态: ${{ job.status }}"
          fi
          echo "发送内容: ${MSG}"
          curl "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="${MSG}"
          echo ""
