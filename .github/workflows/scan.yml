name: CF Reality IP Scanner

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
    - name: 拉取仓库代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: pip install geoip2

    - name: 下载 GeoIP 数据库
      run: |
        curl -L -o GeoLite2-Country.mmdb \
          https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb

    - name: 执行 IP 扫描脚本
      run: python main.py

    - name: 提交并推送结果
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add *.txt
        git diff --staged --quiet && echo "无变化，跳过提交" || {
          git commit -m "auto: update result"
          git pull --rebase
          git push
        }
