name: Scan Alibaba Full443

on:
  workflow_dispatch:
  schedule:
    # UTC 01:00 / 13:00 —— 北京 09:00 / 21:00
    - cron: '0 1,13 * * *'

concurrency:
  group: scan-alibaba-full443
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download GeoIP Database
        run: |
          for i in 1 2 3; do
            curl -L --fail -o GeoLite2-Country.mmdb \
              https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb && break
            echo "retry $i..."; sleep 5
          done

      - name: Pull old results and state
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Irreversibles/proxyip.git result_repo
          cp result_repo/Alibaba.txt ./ 2>/dev/null || true
          mkdir -p state
          cp result_repo/state/prefix_meta_Alibaba.json state/ 2>/dev/null || true
          cp result_repo/state/fullcover_state_Alibaba.json state/ 2>/dev/null || true

      - name: Run Scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
          BUDGET_IPS: "2000000"
        run: |
          python check_cf_asn_full443.py "45102,37963" "Alibaba"

      - name: Push result to private repo
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          cp Alibaba.txt result_repo/ 2>/dev/null || true
          mkdir -p result_repo/state
          cp state/prefix_meta_Alibaba.json result_repo/state/ 2>/dev/null || true
          cp state/fullcover_state_Alibaba.json result_repo/state/ 2>/dev/null || true

          cd result_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # 只 add 自己的文件，不用通配符（避免把别的任务的 state 旧副本一起提交）
          git add Alibaba.txt || true
          git add state/prefix_meta_Alibaba.json || true
          git add state/fullcover_state_Alibaba.json || true

          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "auto: update Alibaba full443"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push 冲突，第 $i 次重试..."
              git pull --rebase --autostash || exit 1
              sleep $((RANDOM % 10 + 5))
            done
          fi

      - name: Notify TG
        if: always()
        run: |
          COUNT=$(cat count.txt 2>/dev/null || echo "?")
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ 扫描完成%0A服务商: Alibaba%0AASN: 45102+37963%0A本次新增: ${COUNT} 个"
          else
            MSG="❌ 扫描失败%0A服务商: Alibaba%0A状态: ${{ job.status }}"
          fi
          echo "发送内容: ${MSG}"
          RESP=$(curl -sS "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="${MSG}")
          echo "$RESP"
          case "$RESP" in
            *'"ok":true'*) : ;;
            *) echo "::error::TG 推送失败" ;;
          esac
