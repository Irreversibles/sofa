name: Scan Google Full443

on:
  workflow_dispatch:
  schedule:
    # UTC 04:00 / 16:00 —— 北京 12:00 / 00:00
    - cron: '0 4,16 * * *'

concurrency:
  group: scan-google-full443
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull old results and state
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Irreversibles/proxyip.git result_repo
          cp result_repo/Google.txt ./ 2>/dev/null || true
          mkdir -p state
          cp result_repo/state/prefix_meta_Google.json state/ 2>/dev/null || true
          cp result_repo/state/fullcover_state_Google.json state/ 2>/dev/null || true

      - name: Run Scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
          BUDGET_IPS: "3000000"
        run: |
          python check_cf_asn_full443.py "396982,19527" "Google"

      - name: Push result to private repo
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          cp Google.txt result_repo/ 2>/dev/null || true
          mkdir -p result_repo/state
          cp state/prefix_meta_Google.json result_repo/state/ 2>/dev/null || true
          cp state/fullcover_state_Google.json result_repo/state/ 2>/dev/null || true

          cd result_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # 只 add 自己的文件，不用通配符（避免把别的任务的 state 旧副本一起提交）
          git add Google.txt || true
          git add state/prefix_meta_Google.json || true
          git add state/fullcover_state_Google.json || true

          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "auto: update Google full443"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push 冲突，第 $i 次重试..."
              if ! git pull --rebase origin main; then
                # rebase 冲突：结果文件是行集合、顺序无关，取并集即可。
                # 冲突通常来自 recheck 同时在刷 country / 剔除失效条目。
                CONFLICTS=$(git diff --name-only --diff-filter=U)
                if [ -n "$CONFLICTS" ]; then
                  for f in $CONFLICTS; do
                    echo "  合并冲突文件: $f"
                    sort -u "$f" -o "$f"
                    git add "$f"
                  done
                  GIT_EDITOR=true git rebase --continue || git rebase --abort
                else
                  git rebase --abort 2>/dev/null || true
                fi
              fi
              sleep $((RANDOM % 10 + 5))
            done
          fi

      - name: Notify TG
        if: always()
        run: |
          COUNT=$(cat count.txt 2>/dev/null || echo "?")
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ 扫描完成%0A服务商: Google%0AASN: 396982+19527%0A本次新增: ${COUNT} 个"
          else
            MSG="❌ 扫描失败%0A服务商: Google%0A状态: ${{ job.status }}"
          fi
          echo "发送内容: ${MSG}"
          RESP=$(curl -sS "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="${MSG}")
          echo "$RESP"
          case "$RESP" in
            *'"ok":true'*) : ;;
            *) echo "::error::TG 推送失败" ;;
          esac
