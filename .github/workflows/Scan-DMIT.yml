name: Scan DMIT (AS906)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'   # 每周一 UTC 03:00

concurrency:
  group: scan-dmit
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read   # 公仓只读，不写

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install telethon

      - name: Pull old DMIT result + private port state
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Irreversibles/proxyip.git result_repo
          cp result_repo/DMIT.txt ./ 2>/dev/null || true
          cp result_repo/dmit_ports_state.json ./ 2>/dev/null || true
          cp result_repo/dmit_ports_pool.txt ./ 2>/dev/null || true
          test -f dmit_ports_state.json || echo '{"last_msg_id":0,"ports":[]}' > dmit_ports_state.json

      - name: Collect DMIT ports from TG (history + incremental)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_B64: ${{ secrets.TG_SESSION_B64 }}
          TG_SOURCE_CHAT: ${{ secrets.TG_SOURCE_CHAT }}
          TG_FETCH_LIMIT: "5000"
          STATE_FILE: "dmit_ports_state.json"
          OUT_FILE: "dmit_ports_pool.txt"
        run: |
          python collect_dmit_ports.py
          # 仅打印数量，不打印端口明文
          echo "[INFO] pool_count=$(wc -l < dmit_ports_pool.txt || echo 0)"

      - name: Merge default ports + TG ports (masked)
        env:
          DEFAULT_PORTS: "443,8443,2053,2083,2096"
        run: |
          TG_PORTS=$(paste -sd, dmit_ports_pool.txt 2>/dev/null || true)
          export TG_PORTS

          python - <<'PY'
          import os

          def parse_ports(s):
              out = set()
              for x in (s or "").replace(" ", "").split(","):
                  if x.isdigit():
                      p = int(x)
                      if 1 <= p <= 65535:
                          out.add(p)
              return out

          default_ports = parse_ports(os.environ.get("DEFAULT_PORTS", ""))
          tg_ports = parse_ports(os.environ.get("TG_PORTS", ""))
          merged = sorted(default_ports | tg_ports)
          merged_str = ",".join(str(p) for p in merged)

          # 不打印明文端口，只打印数量
          print(f"[INFO] default_count={len(default_ports)}")
          print(f"[INFO] tg_count={len(tg_ports)}")
          print(f"[INFO] merged_count={len(merged)}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"MERGED_PORTS={merged_str}\n")
              f.write(f"MERGED_PORTS_COUNT={len(merged)}\n")
          PY

      - name: Run Scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
        run: |
          echo "[INFO] DMIT scan with merged ports count: ${MERGED_PORTS_COUNT}"
          python check_cf_asn.py "906" "DMIT" "${MERGED_PORTS}"

      - name: Push DMIT result + private port state to private repo
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          if [ ! -s DMIT.txt ]; then
            echo "DMIT.txt 不存在或为空，本次无结果，跳过推送"
            exit 0
          fi

          cp DMIT.txt result_repo/
          cp dmit_ports_state.json result_repo/ 2>/dev/null || true
          cp dmit_ports_pool.txt result_repo/ 2>/dev/null || true

          cd result_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add DMIT.txt dmit_ports_state.json dmit_ports_pool.txt

          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "auto: update DMIT + ports pool/state"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push 冲突，第 $i 次重试..."
              if ! git pull --rebase origin main; then
                CONFLICTS=$(git diff --name-only --diff-filter=U)
                ABORT=0
                if [ -n "$CONFLICTS" ]; then
                  for f in $CONFLICTS; do
                    case "$f" in
                      *.txt)
                        sort -u "$f" -o "$f"
                        git add "$f"
                        ;;
                      *.json)
                        git checkout --ours "$f" || true
                        git add "$f"
                        ;;
                      *)
                        ABORT=1
                        break
                        ;;
                    esac
                  done
                fi
                if [ "$ABORT" = "1" ]; then
                  git rebase --abort 2>/dev/null || true
                elif [ -n "$CONFLICTS" ]; then
                  GIT_EDITOR=true git rebase --continue || git rebase --abort
                else
                  git rebase --abort 2>/dev/null || true
                fi
              fi
              sleep $((RANDOM % 10 + 5))
            done
          fi

      - name: Cleanup local sensitive files
        if: always()
        run: |
          rm -f dmit_ports_pool.txt dmit_ports_state.json

      - name: Notify TG
        if: always()
        run: |
          COUNT=$(cat count.txt 2>/dev/null || echo "?")
          PCOUNT="${MERGED_PORTS_COUNT:-?}"
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ 扫描完成%0A服务商: DMIT%0A目标: AS906%0A端口数: ${PCOUNT}%0A本次新增: ${COUNT} 个"
          else
            MSG="❌ 扫描失败%0A服务商: DMIT%0A目标: AS906%0A状态: ${{ job.status }}"
          fi
          RESP=$(curl -sS "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="${MSG}")
          echo "$RESP"
          case "$RESP" in
            *'"ok":true'*) : ;;
            *) echo "::error::TG 推送失败" ;;
          esac
