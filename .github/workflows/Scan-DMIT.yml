name: Scan DMIT (AS906)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: scan-dmit
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download GeoIP Database
        run: |
          for i in 1 2 3; do
            curl -L --fail -o GeoLite2-Country.mmdb \
              https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb && break
            echo "retry $i..."; sleep 5
          done

      - name: Pull old results
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Irreversibles/proxyip.git result_repo
          # 只拷自己的结果文件：本轮只会更新 DMIT.txt，
          # 拉别的文件下来毫无用处，反而可能在 push 时把它们的旧副本推回去
          cp result_repo/DMIT.txt ./ 2>/dev/null || true

      - name: Run Scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
        run: |
          python check_cf_asn.py "906" "DMIT" "443,8443,2053,2083,2096"

      - name: Push result to private repo
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          if [ ! -s DMIT.txt ]; then
            echo "DMIT.txt 不存在或为空，本次无结果，跳过推送"
            exit 0
          fi
          cp DMIT.txt result_repo/

          cd result_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add DMIT.txt
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "auto: update DMIT"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push 冲突，第 $i 次重试..."
              git pull --rebase --autostash || exit 1
              sleep $((RANDOM % 10 + 5))
            done
          fi

      - name: Notify TG
        if: always()
        run: |
          COUNT=$(cat count.txt 2>/dev/null || echo "?")
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ 扫描完成%0A服务商: DMIT%0A目标: AS906%0A本次新增: ${COUNT} 个"
          else
            MSG="❌ 扫描失败%0A服务商: DMIT%0A目标: AS906%0A状态: ${{ job.status }}"
          fi
          echo "发送内容: ${MSG}"
          RESP=$(curl -sS "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="${MSG}")
          echo "$RESP"
          case "$RESP" in
            *'"ok":true'*) : ;;
            *) echo "::error::TG 推送失败" ;;
          esac
