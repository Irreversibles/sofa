name: Scan DMIT

on:
  workflow_dispatch:
  schedule:
    # 每天 02:20 UTC 触发，是否执行由 build 的 SHOULD_RUN 决定。
    #
    # DMIT / xTom / LongTail 三条线共写 dmit_ports_state.json，JSON 冲突
    # rebase 解不了（只能 --theirs 丢一方的轮转标记），所以按 8 小时等距
    # 排开：DMIT 02:20 → LongTail 11:00 → xTom 19:00。间隔 8h40m / 8h /
    # 7h20m，都大于 timeout-minutes 350（5h50m），跑满上限也不会重叠。
    # 本线固定第一位：collect 步骤是全系统唯一采集入口，越早跑，当天
    # 后面两条线拿到的端口档案越新。
    - cron: '20 2 * * *'

concurrency:
  group: scan-dmit
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install telethon
          sudo apt-get update
          sudo apt-get install -y masscan

      - name: Pull old result + port state
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Irreversibles/proxyip.git result_repo
          cp result_repo/DMIT.txt ./ 2>/dev/null || true
          cp result_repo/dmit_ports_state.json ./ 2>/dev/null || true

      # 采集无条件执行：即使今天不扫，也要保住新端口和游标。
      # 这一步是全系统唯一的采集入口 —— 它不按 ASN 过滤，消息里出现的
      # 每个 ASN 都会写进对应桶，所以 xTom / LongTail 等其他线的端口
      # 也靠它更新。日志里 "发布消息 N 条" 长期为 0 说明采集断了
      #（session 过期等），那时所有线的端口档案都会停止增长。
      - name: Collect ports from TG group
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_B64: ${{ secrets.TG_SESSION_B64 }}
          TG_SOURCE_CHAT: ${{ secrets.TG_SOURCE_CHAT }}
          TG_SENDER: ${{ secrets.TG_SENDER }}
          TG_FETCH_LIMIT: "5000"
          STATE_FILE: "dmit_ports_state.json"
          OUT_FILE: "dmit_ports_pool.txt"
        run: python collect_dmit_ports.py

      # CSV 是端口的另一大来源（xTom 的 155 个端口里 124 个来自 CSV）。
      # 按 csv_seen_ids 增量，已处理过的文件跳过，通常 0 个新文件、秒级返回。
      # continue-on-error：CSV 是补充来源，频道拉取失败不该阻断扫描。
      - name: Collect ports from TG channel CSV
        continue-on-error: true
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_B64: ${{ secrets.TG_SESSION_B64 }}
          TG_FILE_CHAT: ${{ secrets.TG_FILE_CHAT }}
          STATE_FILE: "dmit_ports_state.json"
        run: python collect_csv_ports.py

      # 选端口 + 决策 SHOULD_RUN（手动触发时强制跑）。
      # ASN 支持逗号分隔多值：906 和 32519 都是 DMIT，共用一条线、
      # 一份端口池；build 合并两桶的端口，扫描器合并两者的 IP 段。
      # 这里是本线 ASN 列表的唯一定义处，finalize 继承 SCAN_TARGET。
      - name: Build port list + cadence decision
        env:
          STATE_FILE: "dmit_ports_state.json"
          ASN: "906,32519"
          DEFAULT_PORTS: "443,8443,2053,2083,2096"
          SCAN_BUDGET_MIN: "170"
          # 5000pps 实测吞吐（本线：4,474,880 目标 / 51.1 分钟）。
          # 仅在 state 里还没有 EMA 时用作初值。
          TCP_THROUGHPUT: "87604"
          THROUGHPUT_SAFETY: "0.85"
          EMA_ALPHA: "0.5"
          PORTS_MIN_TOTAL: "10"
          PORTS_MAX_TOTAL: "80"
          CADENCE_CYCLE1_DAYS: "3"
          CADENCE_CYCLE2_DAYS: "2"
          CADENCE_CYCLE4_DAYS: "1"
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python build_dmit_ports.py

      # 扫描目标用 build 写出的 SCAN_TARGET，以后增减 ASN 只改上面的 ASN 即可
      - name: Run Scan
        id: scan
        if: env.SHOULD_RUN == 'true'
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
          CHECK_API: ${{ secrets.CHECK_API }}
          MASK_PORT_LOG: "1"
          SCAN_DEADLINE_MIN: "300"
          MASSCAN_RATE: "5000"
          MASSCAN_RETRIES: "2"
          MASSCAN_WAIT: "5"
        run: |
          echo "[INFO] scan_target=${SCAN_TARGET} port_count=${MERGED_PORTS_COUNT} est=${EST_MINUTES}min"
          python check_cf_asn_masscan_dmit.py "${SCAN_TARGET}" "DMIT" "${MERGED_PORTS}"

      # 只有真正扫成功才推进轮转（读 scan_done_ports.txt）+ EMA 校准吞吐。
      # ASN 继承 build 写出的 SCAN_TARGET，不重复维护第二份列表 —— 两处
      # 一旦不一致，缺失桶的 last_scanned 标不上，那些端口会被无限重选、
      # 轮转永不推进，且日志看不出异常。
      - name: Finalize port rotation
        if: env.SHOULD_RUN == 'true' && steps.scan.outcome == 'success'
        env:
          STATE_FILE: "dmit_ports_state.json"
          ASN: ${{ env.SCAN_TARGET }}
        run: python build_dmit_ports.py --finalize

      # state 无条件推送：跳过扫描也要保住采集成果和轮转进度
      - name: Push port state (always)
        if: always()
        run: |
          test -d result_repo || exit 0
          test -f dmit_ports_state.json || exit 0

          cp dmit_ports_state.json result_repo/
          cp dmit_ports_pool.txt result_repo/ 2>/dev/null || true

          cd result_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dmit_ports_state.json dmit_ports_pool.txt 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "no state change"
            exit 0
          fi

          git commit -m "auto: update port archive (TG group + channel CSV)"
          for i in 1 2 3 4 5; do
            git push && break
            echo "state push 冲突，第 $i 次重试..."
            if ! git pull --rebase origin main; then
              CONFLICTS=$(git diff --name-only --diff-filter=U)
              if [ -n "$CONFLICTS" ]; then
                for f in $CONFLICTS; do
                  case "$f" in
                    *.json) git checkout --theirs "$f" || true ;;
                    *)      sort -u "$f" -o "$f" ;;
                  esac
                  git add "$f"
                done
                GIT_EDITOR=true git rebase --continue || git rebase --abort
              else
                git rebase --abort 2>/dev/null || true
              fi
            fi
            sleep $((RANDOM % 10 + 5))
          done

      - name: Push DMIT result
        if: env.SHOULD_RUN == 'true' && steps.scan.outcome == 'success'
        run: |
          if [ ! -s DMIT.txt ]; then
            echo "DMIT.txt 不存在或为空，跳过推送"
            exit 0
          fi

          cp DMIT.txt result_repo/

          cd result_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add DMIT.txt

          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi

          git commit -m "auto: update DMIT"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push 冲突，第 $i 次重试..."
            if ! git pull --rebase origin main; then
              # .txt 结果文件是行集合、顺序无关，sort -u 取并集安全
              #（冲突通常来自 recheck 同时在刷 country / 剔除失效条目）
              CONFLICTS=$(git diff --name-only --diff-filter=U)
              ABORT=0
              if [ -n "$CONFLICTS" ]; then
                for f in $CONFLICTS; do
                  case "$f" in
                    *.txt)  sort -u "$f" -o "$f"; git add "$f" ;;
                    *.json) git checkout --theirs "$f" || true; git add "$f" ;;
                    *)      ABORT=1; break ;;
                  esac
                done
              fi
              if [ "$ABORT" = "1" ]; then
                git rebase --abort 2>/dev/null || true
              elif [ -n "$CONFLICTS" ]; then
                GIT_EDITOR=true git rebase --continue || git rebase --abort
              else
                git rebase --abort 2>/dev/null || true
              fi
            fi
            sleep $((RANDOM % 10 + 5))
          done

      - name: Cleanup local sensitive files
        if: always()
        run: |
          rm -f dmit_ports_pool.txt dmit_ports_state.json
          rm -f scan_done_ports.txt scan_metrics.json scan_truncated.txt
          rm -f scan_out_files.txt
          rm -f tg_dmit_ports.session
          rm -rf .tmp

      - name: Notify TG
        if: always()
        run: |
          COUNT=$(cat count.txt 2>/dev/null || echo "?")
          TRUNC=$(cat scan_truncated.txt 2>/dev/null || echo "0")
          WARN=""
          [ "$TRUNC" = "1" ] && WARN="%0A⚠️ 本轮触及时间闸门，未扫全，剩余下轮优先补"

          if [ "${{ job.status }}" != "success" ]; then
            MSG="❌ 扫描失败%0A服务商: DMIT (AS906+32519)%0A状态: ${{ job.status }}"
          elif [ "${SHOULD_RUN:-false}" != "true" ]; then
            MSG="⏭️ 本次跳过%0A服务商: DMIT (AS906+32519)%0A端口档案: ${POOL_COUNT:-?}%0A阶段: ${SWEEP_PHASE:-?}（待覆盖 ${REMAINING_UNSCANNED:-?}）%0A间隔 ${CADENCE_DAYS:-?} 天"
          else
            MSG="✅ 扫描完成%0A服务商: DMIT (AS906+32519)%0A端口: ${MERGED_PORTS_COUNT:-?}（默认5 + 新扫 ${NEW_COUNT:-?} + 复扫 ${RESCAN_COUNT:-?}）%0A阶段: ${SWEEP_PHASE:-?}（池 ${POOL_COUNT:-?}，待覆盖 ${REMAINING_UNSCANNED:-?}）%0A轮转一圈 ${CYCLE_ROUNDS:-?} 轮 → 间隔 ${CADENCE_DAYS:-?} 天%0A本次新增: ${COUNT} 个${WARN}"
          fi

          RESP=$(curl -sS "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="${MSG}")

          case "$RESP" in
            *'"ok":true'*) : ;;
            *) echo "::error::TG 推送失败" ;;
          esac
