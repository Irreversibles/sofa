name: Scan DMIT (AS906 adaptive stable)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 */3 * *'   # 每3天 UTC 03:00

concurrency:
  group: scan-dmit
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install telethon

      - name: Pull old DMIT result + private port state
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Irreversibles/proxyip.git result_repo
          cp result_repo/DMIT.txt ./ 2>/dev/null || true
          cp result_repo/dmit_ports_state.json ./ 2>/dev/null || true
          cp result_repo/dmit_ports_pool.txt ./ 2>/dev/null || true
          test -f dmit_ports_state.json || echo '{"last_msg_id":0,"ports":[]}' > dmit_ports_state.json

      - name: Collect DMIT ports from TG
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_B64: ${{ secrets.TG_SESSION_B64 }}
          TG_SOURCE_CHAT: ${{ secrets.TG_SOURCE_CHAT }}
          TG_FETCH_LIMIT: "5000"
          STATE_FILE: "dmit_ports_state.json"
          OUT_FILE: "dmit_ports_pool.txt"
        run: |
          python collect_dmit_ports.py
          echo "[INFO] pool_count=$(wc -l < dmit_ports_pool.txt || echo 0)"

      - name: Build adaptive merged ports (rotate + anti-repeat, masked)
        env:
          DEFAULT_PORTS: "443,8443,2053,2083,2096"
          EXTRA_SMALL: "50"
          EXTRA_MEDIUM: "30"
          EXTRA_LARGE: "20"
          EXTRA_HUGE: "10"
          THRESH_MEDIUM: "200"
          THRESH_LARGE: "500"
        run: |
          TG_PORTS=$(paste -sd, dmit_ports_pool.txt 2>/dev/null || true)
          export TG_PORTS

          python - <<'PY'
          import os, json, hashlib

          STATE = "dmit_ports_state.json"

          def parse_ports(s):
              out = set()
              for x in (s or "").replace(" ", "").split(","):
                  if x.isdigit():
                      p = int(x)
                      if 1 <= p <= 65535:
                          out.add(p)
              return out

          default_ports = sorted(parse_ports(os.environ.get("DEFAULT_PORTS", "")))
          tg_ports_all = sorted(parse_ports(os.environ.get("TG_PORTS", "")))

          extra_small = int(os.environ.get("EXTRA_SMALL", "50"))
          extra_medium = int(os.environ.get("EXTRA_MEDIUM", "30"))
          extra_large = int(os.environ.get("EXTRA_LARGE", "20"))
          extra_huge = int(os.environ.get("EXTRA_HUGE", "10"))
          th_medium = int(os.environ.get("THRESH_MEDIUM", "200"))
          th_large = int(os.environ.get("THRESH_LARGE", "500"))

          default_set = set(default_ports)
          extra_pool = [p for p in tg_ports_all if p not in default_set]
          extra_cnt = len(extra_pool)

          if extra_cnt <= 50:
              max_extra = extra_small
          elif extra_cnt <= th_medium:
              max_extra = extra_medium
          elif extra_cnt <= th_large:
              max_extra = extra_large
          else:
              max_extra = extra_huge

          st = {}
          cursor = 0
          try:
              with open(STATE, "r", encoding="utf-8") as f:
                  st = json.load(f)
              cursor = int(st.get("extra_cursor", 0))
          except Exception:
              st = {}

          prev_sig = st.get("last_selected_sig", "")

          def select_batch(pool, start, k):
              if not pool or k <= 0:
                  return [], 0
              n = len(pool)
              i = start % n
              out = []
              for _ in range(min(k, n)):
                  out.append(pool[i])
                  i = (i + 1) % n
              return out, i

          selected, next_cursor = select_batch(extra_pool, cursor, max_extra)
          sel_sig = hashlib.sha1(",".join(map(str, selected)).encode()).hexdigest() if selected else ""

          if selected and sel_sig == prev_sig and len(extra_pool) > len(selected):
              jump_start = (next_cursor + max(1, len(selected))) % len(extra_pool)
              selected, next_cursor = select_batch(extra_pool, jump_start, max_extra)
              sel_sig = hashlib.sha1(",".join(map(str, selected)).encode()).hexdigest() if selected else ""

          merged = sorted(set(default_ports) | set(selected))
          merged_str = ",".join(str(p) for p in merged)

          st["extra_cursor"] = int(next_cursor)
          st["extra_pool_count"] = extra_cnt
          st["extra_selected_count"] = len(selected)
          st["adaptive_max_extra"] = int(max_extra)
          st["last_selected_sig"] = sel_sig

          tmp = STATE + ".tmp"
          with open(tmp, "w", encoding="utf-8") as f:
              json.dump(st, f, ensure_ascii=False, indent=2)
          os.replace(tmp, STATE)

          print(f"[INFO] default_count={len(default_ports)}")
          print(f"[INFO] tg_total_count={len(tg_ports_all)}")
          print(f"[INFO] extra_pool_count={extra_cnt}")
          print(f"[INFO] adaptive_max_extra={max_extra}")
          print(f"[INFO] extra_selected_count={len(selected)}")
          print(f"[INFO] merged_count={len(merged)}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"MERGED_PORTS={merged_str}\n")
              f.write(f"MERGED_PORTS_COUNT={len(merged)}\n")
              f.write(f"EXTRA_POOL_COUNT={extra_cnt}\n")
              f.write(f"EXTRA_SELECTED_COUNT={len(selected)}\n")
              f.write(f"ADAPTIVE_MAX_EXTRA={max_extra}\n")
          PY

      - name: Run Scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
          MASK_PORT_LOG: "1"
        run: |
          echo "[INFO] scan_port_count=${MERGED_PORTS_COUNT}"
          python check_cf_asn.py "906" "DMIT" "${MERGED_PORTS}"

      - name: Push DMIT result + private port state
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          if [ ! -s DMIT.txt ]; then
            echo "DMIT.txt 不存在或为空，本次无结果，跳过推送"
            exit 0
          fi

          cp DMIT.txt result_repo/
          cp dmit_ports_state.json result_repo/ 2>/dev/null || true
          cp dmit_ports_pool.txt result_repo/ 2>/dev/null || true

          cd result_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add DMIT.txt dmit_ports_state.json dmit_ports_pool.txt

          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "auto: update DMIT + adaptive ports state"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push 冲突，第 $i 次重试..."
              if ! git pull --rebase origin main; then
                CONFLICTS=$(git diff --name-only --diff-filter=U)
                ABORT=0
                if [ -n "$CONFLICTS" ]; then
                  for f in $CONFLICTS; do
                    case "$f" in
                      *.txt)
                        sort -u "$f" -o "$f"
                        git add "$f"
                        ;;
                      *.json)
                        git checkout --ours "$f" || true
                        git add "$f"
                        ;;
                      *)
                        ABORT=1
                        break
                        ;;
                    esac
                  done
                fi
                if [ "$ABORT" = "1" ]; then
                  git rebase --abort 2>/dev/null || true
                elif [ -n "$CONFLICTS" ]; then
                  GIT_EDITOR=true git rebase --continue || git rebase --abort
                else
                  git rebase --abort 2>/dev/null || true
                fi
              fi
              sleep $((RANDOM % 10 + 5))
            done
          fi

      - name: Cleanup local sensitive files
        if: always()
        run: |
          rm -f dmit_ports_pool.txt dmit_ports_state.json

      - name: Notify TG
        if: always()
        run: |
          COUNT=$(cat count.txt 2>/dev/null || echo "?")
          PCOUNT="${MERGED_PORTS_COUNT:-?}"
          EX_POOL="${EXTRA_POOL_COUNT:-?}"
          EX_SEL="${EXTRA_SELECTED_COUNT:-?}"
          EX_MAX="${ADAPTIVE_MAX_EXTRA:-?}"

          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ 扫描完成%0A服务商: DMIT%0A目标: AS906%0A端口总数: ${PCOUNT}%0A高位池: ${EX_POOL}%0A本次高位: ${EX_SEL}(上限${EX_MAX})%0A本次新增: ${COUNT} 个"
          else
            MSG="❌ 扫描失败%0A服务商: DMIT%0A目标: AS906%0A状态: ${{ job.status }}"
          fi

          RESP=$(curl -sS "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="${MSG}")
          case "$RESP" in
            *'"ok":true'*) : ;;
            *) echo "::error::TG 推送失败" ;;
          esac
