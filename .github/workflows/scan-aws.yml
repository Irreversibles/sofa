name: Scan AWS (HK/JP/SG)

on:
  workflow_dispatch:
    inputs:
      ports:
        description: '端口，逗号分隔。单端口能多扫一倍 IP，建议就用 443'
        required: false
        default: '443'
      rate:
        description: 'masscan pps。实测 10000 稳定跑满且未被限速，别降'
        required: false
        default: '10000'
      max_ips:
        description: '目标 IP 上限，超出按段顺序截断。0=不限'
        required: false
        default: '12000000'
  #schedule:
    # 周二/周五 08:37 UTC（北京 16:37）。
    #
    # 选这个时段的理由：
    #   前面 Recheck(06:17 起，闸门 100 分钟) 最坏 08:00 收工 —— 错开它是
    #     硬要求。两边都要打 CHECK_API，撞上会把 Worker 配额吃光，导致
    #     recheck 侧 API 异常占比破 30%（API_ERROR_ABORT_RATIO），整轮复验
    #     被静默跳过，而 TG 通知仍显示"完成"，只有日志里看得出来。
    #   DMIT(02:20 起) 闸门最坏 08:10。
    #   后面 LongTail 11:00 起，前 10 分钟在装依赖/clone/选端口，不打 API。
    #   周二/周五避开 Tencent（周一四 10:00）。
    #
    # 本线不写任何 state（无端口轮转、无 cadence、无 finalize），不参与
    # dmit_ports_state.json 的 JSON 冲突，所以不受 DMIT/LongTail/xTom
    # 那个 8 小时等距窗口的约束，只需避开 CHECK_API 竞争。
    #
    # 频率 2 天一次而非每天：AWS abuse 团队比小商家积极，投诉发给流量
    # 来源方（GitHub），低频直接降低暴露面。
    #
    # 分钟取 37 而非 0：整点是 GitHub 定时队列最拥挤的时刻，被丢弃概率高。
    #- cron: '37 8 * * 2,5'

concurrency:
  group: scan-aws
  cancel-in-progress: false

# ⚠️ 本线产出是【候选集】，不能直接当入口 IP 用。
#
# 2026-08-29 首轮 930 条，下载到本地用 filter_seg.py 从国内实测：
#     timeout 719 (77.3%)  国内直连不通
#     ok      191 (20.5%)  可用
#     cert     17 ( 1.8%)  CF Origin CA 源站，假阳性
# 原因是本流程全程美国视角（masscan、TLS 三阶段、CHECK_API、Recheck 都
# 从 runner 发起），而入口 IP 要求的是「国内客户端 → 该 IP」这个方向可达。
# CHECK_API 验的是「Worker colo → 该地址」（ProxyIP 用途），两个方向不同。
# 实测 13.113.187.222 在 Actions 里全程通过，从国内 TCP 就超时。
#
# 所以每轮扫完必须本地跑一次筛选，用 AWS.entry.txt 而不是 AWS.txt：
#     python filter_seg.py AWS.txt
# EC2 弹性 IP 释放后几小时就重新分配，筛选结果有保质期，隔几天要重跑。
#
# region 差异（首轮实测，可用率 / 延迟中位）：
#     ap-southeast-1 新加坡  16.5%  最快   259.8 万 IP
#     ap-northeast-1 东京    22.6%  中     429.9 万 IP
#     ap-east-1      香港    57.1%  最慢    78.4 万 IP（样本仅 21 条）
# 香港命中率最高但延迟最差，新加坡反之。三个都留着 —— 整轮 84 分钟、
# 闸门 140，时间不紧张，没必要为省时间牺牲绝对产出。
jobs:
  scan:
    runs-on: ubuntu-latest
    # 首轮实测 1h24m41s（masscan 42.8min + TLS/API 约 34min + 依赖&推送）。
    # 170 留约 85 分钟余量，够 8443 或 AWS 扩容后的增长。
    timeout-minutes: 170
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y masscan

      - name: Pull old result
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Irreversibles/proxyip.git result_repo
          # write_result_file 靠本地已有文件触发防覆盖保护，缺文件会导致
          # old_count=0、保护不触发，用只含本轮结果的版本覆盖历史累积。
          cp result_repo/AWS.txt ./ 2>/dev/null || true

      # 按 region 取段而非按 ASN：AS16509 全球 1.75 亿 IPv4，按 ASN 扫等于
      # 把欧美段也一起扫了。AWS 官方 ip-ranges.json 带 region 字段，归属比
      # BGP 前缀准（是 AWS 自己标的）。实测四个 region 的 EC2 段只有 808 万，
      # 比按 ASN 少一个数量级。
      # 只取 service=EC2：AMAZON 是含 S3/API Gateway 等托管服务的超集，
      # CLOUDFRONT 是 CDN 边缘，都不是 proxyip 后端。
      #
      # 首轮实测分布（225 → 176 段合并后）：
      #   ap-northeast-1 东京   69 段  4,299,296 IP  53.2%
      #   ap-southeast-1 新加坡 75 段  2,597,920 IP  32.1%
      #   ap-east-1      香港   27 段    784,144 IP   9.7%
      #   ap-northeast-3 大阪   22 段    403,984 IP   5.0%
      #
      # MAX_IPS 兜住 AWS 扩容：段数悄悄涨了也不会静默超时间预算。
      # 12,000,000 的来历 —— 按首轮实测比例（每 100 万 IP 对应 13.3 万开放
      # 目标、约 2.5 分钟 TLS）：masscan 63 分钟 + TLS 40 分钟 = 103 分钟，
      # 在 140 闸门内安全。设 19M 会到 163 分钟，超。
      - name: Build AWS target list
        env:
          AWS_REGIONS: 'ap-east-1,ap-northeast-1,ap-northeast-3,ap-southeast-1'
          AWS_SERVICE: 'EC2'
          OUT_FILE: 'aws_targets.txt'
          MAX_IPS: ${{ inputs.max_ips || '12000000' }}
        run: python build_aws_targets.py

      # 一轮扫完，不做断点续扫，所以没有 state、没有 cadence、没有 finalize。
      # 被闸门截断也不要紧：masscan 内部会打乱目标顺序，每轮覆盖的是随机
      # 子集，长期看等价于全覆盖。
      #
      # rate 10000 不要降：首轮实际速率稳定在 9.8-9.99kpps 全程无掉速，
      # 说明没被限速；开放率 13.29% 也不像有大量 SYN 被丢。降到 5000 会让
      # masscan 从 42.8 涨到 85.6 分钟，挤掉 TLS 的预算反而导致一阶段截断。
      #
      # TLS_CONC 500（默认 300）：一阶段要处理 107 万个开放目标，是耗时
      # 最大的一段。首轮 300 并发用了约 34 分钟，平均 19ms/目标 —— 绝大多数
      # 被立刻 RST，没吃满 3 秒超时，所以并发提上去边际收益明显。
      # fd 上限已调到 65536，500 并发绰绰有余。
      #
      # 单端口 443 而非 443,8443：8443 的响应特征未知（可能更多连接超时
      # 而非 RST，那 TLS 阶段会慢得多），等这轮看到 500 并发的时间弹性
      # 再评估。
      - name: Run Scan
        id: scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
          CHECK_API: ${{ secrets.CHECK_API }}
          MASK_PORT_LOG: "1"
          SCAN_DEADLINE_MIN: "140"
          MASSCAN_RATE: ${{ inputs.rate || '10000' }}
          MASSCAN_RETRIES: "2"
          MASSCAN_WAIT: "5"
          TLS_CONC: "500"
        run: |
          echo "[INFO] segs=${AWS_TARGET_SEGS} ips=${AWS_TARGET_IPS}"
          python check_cf_asn_masscan_dmit.py \
            "aws_targets.txt" "AWS" "${{ inputs.ports || '443' }}"

      # 落地国家由 CHECK_API 写进 #country，HK/JP/SG 自然区分开，所以输出
      # 走单文件 AWS.txt、标签不带地区。
      # 注意 #country 对少数条目不准（实测 95.40.227.67 标 #US、
      # 18.166.216.113 标 #JP，实际都是 ap-east-1 的段），别拿它 grep region。
      # 分文件模式（ASN_NAMES）对文件输入无效：CIDR 走 plain_nets，
      # 建不起 IP→ASN 反查表。
      - name: Push result
        if: steps.scan.outcome == 'success'
        run: |
          if [ ! -s scan_out_files.txt ]; then
            echo "本轮无产出文件，跳过推送"
            exit 0
          fi

          while read -r f; do
            [ -z "$f" ] && continue
            [ -s "$f" ] || continue
            cp "$f" result_repo/
          done < scan_out_files.txt

          cd result_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          while read -r f; do
            [ -z "$f" ] && continue
            git add "$f" 2>/dev/null || true
          done < ../scan_out_files.txt

          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi

          git commit -m "auto: update AWS (HK/JP/SG)"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push 冲突，第 $i 次重试..."
            if ! git pull --rebase origin main; then
              # .txt 结果文件是行集合、顺序无关，sort -u 取并集安全
              #（冲突通常来自 recheck 同时在刷 country / 剔除失效条目）
              CONFLICTS=$(git diff --name-only --diff-filter=U)
              ABORT=0
              if [ -n "$CONFLICTS" ]; then
                for f in $CONFLICTS; do
                  case "$f" in
                    *.txt)  sort -u "$f" -o "$f"; git add "$f" ;;
                    *.json) git checkout --theirs "$f" || true; git add "$f" ;;
                    *)      ABORT=1; break ;;
                  esac
                done
              fi
              if [ "$ABORT" = "1" ]; then
                git rebase --abort 2>/dev/null || true
              elif [ -n "$CONFLICTS" ]; then
                GIT_EDITOR=true git rebase --continue || git rebase --abort
              else
                git rebase --abort 2>/dev/null || true
              fi
            fi
            sleep $((RANDOM % 10 + 5))
          done

      - name: Cleanup
        if: always()
        run: |
          rm -f aws_targets.txt
          rm -f scan_done_ports.txt scan_metrics.json scan_truncated.txt
          rm -f scan_out_files.txt
          rm -rf .tmp

      - name: Notify TG
        if: always()
        run: |
          COUNT=$(cat count.txt 2>/dev/null || echo "?")
          TRUNC=$(cat scan_truncated.txt 2>/dev/null || echo "0")
          WARN=""
          [ "$TRUNC" = "1" ] && WARN="%0A⚠️ 本轮触及时间闸门，未扫全（下轮随机覆盖其他段）"

          if [ "${{ job.status }}" != "success" ]; then
            MSG="❌ 扫描失败%0A服务商: AWS (HK/JP/SG)%0A状态: ${{ job.status }}"
          else
            MSG="✅ 扫描完成%0A服务商: AWS (HK/JP/SG)%0A目标: ${AWS_TARGET_IPS:-?} IP / ${AWS_TARGET_SEGS:-?} 段%0A端口: ${{ inputs.ports || '443' }}%0Arate: ${{ inputs.rate || '10000' }}pps%0A本次新增: ${COUNT} 个%0A⚠️ 需本地 filter_seg.py 筛选后使用（约两成可用）${WARN}"
          fi

          RESP=$(curl -sS "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="${MSG}")

          case "$RESP" in
            *'"ok":true'*) : ;;
            *) echo "::error::TG 推送失败" ;;
          esac
