name: Recheck Manual (指定文件)

on:
  workflow_dispatch:
    inputs:
      files:
        description: '要复验的文件,逗号分隔. 填 ALL=全部 例: HKT.txt,Aiyun (HK).txt'
        required: true
        default: 'ALL'
      deadline:
        description: '时间闸门(分钟) 必须 < 120'
        required: false
        default: '100'
      update_state:
        description: '是否更新自动线的3天计时(默认否)'
        type: boolean
        default: false

concurrency:
  group: recheck-manual
  cancel-in-progress: false

jobs:
  recheck-manual:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt

      - name: Pull results
        env: {TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Irreversibles/proxyip.git result_repo
          shopt -s nullglob
          for f in result_repo/*.txt; do
            fn=$(basename "$f")
            case "$fn" in requirements.txt|ip.txt|count.txt|name.txt|recheck_summary.txt) continue ;; esac
            cp "$f" ./ 2>/dev/null || true
          done
          ls -lh *.txt | head -n 20

      - name: Recheck
        env:
          CHECK_API: ${{ secrets.CHECK_API }}
          RECHECK_DEADLINE_MIN: ${{ inputs.deadline }}
          INPUT_FILES: ${{ inputs.files }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, shlex
          raw = os.environ.get("INPUT_FILES","").strip()
          if raw.upper() == "ALL":
              files = [p.name for p in pathlib.Path(".").glob("*.txt") if p.name not in ["requirements.txt","ip.txt","count.txt","name.txt","recheck_summary.txt"]]
          else:
              files = []
              for x in raw.split(","):
                  f = x.strip()
                  if not f: continue
                  if not f.lower().endswith(".txt"): f += ".txt"
                  if pathlib.Path(f).exists():
                      files.append(f)
                  else:
                      print(f"[跳过] 不存在: {f}")
          if not files:
              raise SystemExit("没有可复验的文件，请检查输入文件名是否和私库一致")
          print(f"[*] 本次复验 {len(files)} 个: {files}")
          # 用subprocess避免shell拆空格
          subprocess.run(["python", "recheck_api.py"] + files, check=True)
          pathlib.Path("/tmp/target.list").write_text("\n".join(files), encoding="utf-8")
          PY
          cat recheck_summary.txt 2>/dev/null || echo "无摘要"
          cat recheck_truncated.txt 2>/dev/null || echo "0"

      - name: Stamp cadence state
        if: ${{ inputs.update_state == true }}
        run: |
          python -c "import json,time;json.dump({'last_run_ts':time.time()},open('result_repo/recheck_state.json','w'))"

      - name: Push back
        run: |
          mapfile -t FILES < /tmp/target.list
          for f in "${FILES[@]}"; do cp "$f" result_repo/ 2>/dev/null || true; done
          cd result_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add recheck_state.json 2>/dev/null || true
          for f in "${FILES[@]}"; do git add "$(basename "$f")" 2>/dev/null || true; done
          git diff --staged --quiet && { echo "no change"; exit 0; }
          git commit -m "recheck manual: ${{ inputs.files }}"
          for i in 1 2 3 4 5; do git push && break; echo "push冲突 $i..."; git pull --rebase --autostash || exit 1; sleep $((RANDOM % 10 + 5)); done

      - name: Notify TG
        if: always()
        run: |
          TRUNC=$(cat recheck_truncated.txt 2>/dev/null || echo 0)
          [ "$TRUNC" = "1" ] && WARN=$'\n⚠️ 触及时间闸门，剩余下轮继续' || WARN=""
          DETAILS=$(awk -F: '{rm+=$2;unk+=$3} END{printf "合计剔除 %d 个，异常 %d",rm,unk}' recheck_summary.txt 2>/dev/null || echo "无")
          MSG=$(printf '🔧 手动复验完成\n文件: %s\n%s%s' "${{ inputs.files }}" "$DETAILS" "$WARN")
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" --data-urlencode "chat_id=${{ secrets.TG_CHAT_ID }}" --data-urlencode "text=${MSG}" > /dev/null || true
