name: Recheck Manual (指定文件)

on:
  workflow_dispatch:
    inputs:
      files:
        description: '要复验的文件,逗号分隔. 填 ALL=全部 例: HKT.txt,Aiyun (HK).txt'
        required: true
        default: 'ALL'
      deadline:
        description: '时间闸门(分钟) 必须小于 timeout 120'
        required: false
        default: '100'
      update_state:
        description: '是否更新自动线的3天计时'
        type: boolean
        default: false

concurrency:
  group: recheck # 和自动共用一组，防止自动和手动同时跑抢私库
  cancel-in-progress: false

jobs:
  recheck-manual:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt

      - name: Pull results
        env: {TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Irreversibles/proxyip.git result_repo
          shopt -s nullglob
          for f in result_repo/*.txt; do
            fn=$(basename "$f")
            case "$fn" in requirements.txt|ip.txt|count.txt|name.txt|recheck_summary.txt) continue ;; esac
            cp "$f" ./ 2>/dev/null || true
          done
          echo "私库共 $(ls -1 *.txt 2>/dev/null | wc -l) 个结果文件"

      - name: Resolve files
        run: |
          INPUT="${{ inputs.files }}"
          FILES=()
          if [ "$INPUT" = "ALL" ]; then
            for f in *.txt; do
              case "$f" in requirements.txt|ip.txt|count.txt|name.txt|recheck_summary.txt) continue ;; esac
              FILES+=("$f")
            done
          else
            IFS=',' read -ra ARR <<< "$INPUT"
            for raw in "${ARR[@]}"; do
              f=$(echo "$raw" | xargs) # 去空格
              [[ "$f" != *.txt ]] && f="$f.txt"
              if [ -f "$f" ]; then FILES+=("$f"); else echo "[跳过] 不存在: $f"; fi
            done
          fi
          [ ${#FILES[@]} -eq 0 ] && { echo "::error::没有可复验文件"; exit 1; }
          echo "本次复验 ${#FILES[@]} 个: ${FILES[*]}"
          printf "%s\n" "${FILES[@]}" > /tmp/target.list
          # 传给下一步
          echo "TARGET_COUNT=${#FILES[@]}" >> $GITHUB_ENV

      - name: Recheck
        env:
          CHECK_API: ${{ secrets.CHECK_API }}
          RECHECK_DEADLINE_MIN: ${{ inputs.deadline }}
        run: |
          # 必须用数组传参，带空格的文件名才不会被拆开
          mapfile -t FILES < /tmp/target.list
          echo "复验 ${#FILES[@]} 个文件"
          python recheck_api.py "${FILES[@]}"
          cat recheck_summary.txt 2>/dev/null || echo "无摘要"
          cat recheck_truncated.txt 2>/dev/null || echo "0"

      - name: Stamp cadence state
        if: ${{ inputs.update_state == true }}
        run: |
          python -c "import json,time;json.dump({'last_run_ts':time.time()},open('result_repo/recheck_state.json','w'))"
          echo "已更新 recheck_state.json (手动影响自动节奏)"

      - name: Push back
        run: |
          mapfile -t FILES < /tmp/target.list
          for f in "${FILES[@]}"; do cp "$f" result_repo/ 2>/dev/null || true; done
          cd result_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add recheck_state.json 2>/dev/null || true
          for f in "${FILES[@]}"; do git add "$(basename "$f")" 2>/dev/null || true; done
          git diff --staged --quiet && { echo "no change"; exit 0; }
          git commit -m "recheck manual: ${{ inputs.files }}"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push冲突 $i..."
            git pull --rebase --autostash || exit 1
            sleep $((RANDOM % 10 + 5))
          done

      - name: Notify TG
        if: always()
        run: |
          TRUNC=$(cat recheck_truncated.txt 2>/dev/null || echo 0)
          [ "$TRUNC" = "1" ] && WARN=$'\n⚠️ 触及时间闸门，剩余下轮继续' || WARN=""
          if [ -s recheck_summary.txt ]; then
            DETAILS=$(awk -F: '{rm+=$2;unk+=$3; if($2>0) printf " • %s：剔除 %s 个%s\n",$1,$2,($3>0?" (另 "$3" 条异常)":""); else if($3>0) printf " • %s：%s 条异常\n",$1,$3} END{printf "合计剔除 %d 个",rm; if(unk>0) printf "，%d 条异常",unk}' recheck_summary.txt)
            MSG=$(printf '🔧 手动复验完成\n文件: %s\n%s%s' "${{ inputs.files }}" "$DETAILS" "$WARN")
          else
            MSG=$(printf '🔧 手动复验完成\n文件: %s\n无剔除%s' "${{ inputs.files }}" "$WARN")
          fi
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" --data-urlencode "chat_id=${{ secrets.TG_CHAT_ID }}" --data-urlencode "text=${MSG}" > /dev/null
