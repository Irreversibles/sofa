name: '定时清理 Actions 历史运行日志'

on:
  schedule:
    # 分钟取 23 而非 0：整点是 GitHub 定时队列最拥挤的时刻，容易被丢弃
    - cron: '23 0 * * 1'
  workflow_dispatch:

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3
          # 这是"每个 workflow 各保留 N 条"，不是全仓库 N 条。
          # 原来的 15 让 Recheck（总共才 8 条）整个被豁免，
          # 所以 8/10 起的日志一条都没删掉。
          keep_minimum_runs: 5
