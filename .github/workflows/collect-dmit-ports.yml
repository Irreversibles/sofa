name: Collect DMIT ports from TG

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # 每30分钟跑一次，可改

concurrency:
  group: collect-dmit-ports
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install telethon

      - name: Init state file
        run: |
          test -f dmit_ports_state.json || echo '{"last_msg_id":0,"ports":[]}' > dmit_ports_state.json

      - name: Run collector
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_B64: ${{ secrets.TG_SESSION_B64 }}
          TG_SOURCE_CHAT: ${{ secrets.TG_SOURCE_CHAT }}
          TG_FETCH_LIMIT: "5000"
          STATE_FILE: "dmit_ports_state.json"
          OUT_FILE: "dmit_ports_pool.txt"
        run: |
          python collect_dmit_ports.py
          echo "---- pool lines ----"
          wc -l dmit_ports_pool.txt || true
          echo "---- pool content ----"
          cat dmit_ports_pool.txt || true

      - name: Commit state/pool
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dmit_ports_state.json dmit_ports_pool.txt
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "auto: update dmit ports pool"
            git push
          fi
