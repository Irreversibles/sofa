name: Scan IT7 (AS25820)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 3'   # 周三，和 DMIT(周一)、xTom(周二) 错开

concurrency:
  group: scan-it7
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download GeoIP Database
        run: |
          for i in 1 2 3; do
            curl -L --fail -o GeoLite2-Country.mmdb \
              https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb && break
            echo "retry $i..."; sleep 5
          done

      - name: Pull old results
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Irreversibles/proxyip.git result_repo
          # 只拷自己的结果文件，避免 push 时把别人的旧副本推回去
          cp result_repo/IT7.txt ./ 2>/dev/null || true

      - name: Run Scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
        run: |
          # 不设 TCP_STAGE / TLS_CONC：脚本内 ASN_PROFILES 会自动为 25820
          # 关闭 TCP 预筛并把 TLS 并发降到 200（该 ASN 有扫描检测，
          # 预筛会让本机在 TLS 阶段前被限速，实测 516 → 7）
          python check_cf_asn.py "25820" "IT7" "443,8443"

      - name: Push result to private repo
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          if [ ! -s IT7.txt ]; then
            echo "IT7.txt 不存在或为空，本次无结果，跳过推送"
            exit 0
          fi
          cp IT7.txt result_repo/

          cd result_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add IT7.txt
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "auto: update IT7"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push 冲突，第 $i 次重试..."
              git pull --rebase --autostash || exit 1
              sleep $((RANDOM % 10 + 5))
            done
          fi

      - name: Notify TG
        if: always()
        run: |
          COUNT=$(cat count.txt 2>/dev/null || echo "?")
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ 扫描完成%0A服务商: IT7%0A目标: AS25820%0A本次新增: ${COUNT} 个"
          else
            MSG="❌ 扫描失败%0A服务商: IT7%0A目标: AS25820%0A状态: ${{ job.status }}"
          fi
          echo "发送内容: ${MSG}"
          RESP=$(curl -sS "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="${MSG}")
          echo "$RESP"
          case "$RESP" in
            *'"ok":true'*) : ;;
            *) echo "::error::TG 推送失败" ;;
          esac
