name: Scan xTom

on:
  workflow_dispatch:
  schedule:
    # 每天 19:00 UTC 触发，是否执行由 build 的 SHOULD_RUN 决定。
    #
    # DMIT / xTom / LongTail 三条线共写 dmit_ports_state.json，按 8 小时
    # 等距排开：DMIT 02:20 → LongTail 11:00 → xTom 19:00。本线最坏跑到
    # 次日 00:50（350 分钟上限），距 Alibaba 01:00 和 DMIT 02:20 都有余量。
    # 原先 20:00 起、最坏到 01:50，离 DMIT 只剩 30 分钟，太紧。
    - cron: '0 19 * * *'

concurrency:
  group: scan-xtom
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y masscan

      - name: Pull old result + port state
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Irreversibles/proxyip.git result_repo
          cp result_repo/xTom.txt ./ 2>/dev/null || true
          cp result_repo/dmit_ports_state.json ./ 2>/dev/null || true

      # 不做 collect：端口档案由 DMIT 线的 collect 步骤统一更新（它会写入
      # 所有见到的 ASN 桶，包括 xTom 这六个）。这里只读档案、选端口。
      #
      # 六个 ASN 都是 xTom，共用一条线：build 合并六桶端口池，
      # 扫描器合并六者 IP 段。主桶 3258 存轮转进度和吞吐 EMA。
      # 落地国家由 API 返回写进 #country，所以标签不带地区 —— 这六个
      # ASN 分布在日本/德国/澳洲/新加坡等地，写 "jp" 会自相矛盾。
      #
      # 这里是本线 ASN 列表的唯一定义处，finalize 继承 SCAN_TARGET。
      - name: Build port list + cadence decision
        env:
          STATE_FILE: "dmit_ports_state.json"
          ASN: "3258,6233,3214,8888,9312,4785"
          DEFAULT_PORTS: "443,8443,2053,2083,2096"
          SCAN_BUDGET_MIN: "170"
          # 2000pps 实测吞吐（本线：4,474,880 目标 / 125.4 分钟 = 35,673）。
          # 仅在 state 里还没有 EMA 时用作初值。
          TCP_THROUGHPUT: "35673"
          THROUGHPUT_SAFETY: "0.85"
          EMA_ALPHA: "0.5"
          PORTS_MIN_TOTAL: "10"
          PORTS_MAX_TOTAL: "40"
          CADENCE_CYCLE1_DAYS: "3"
          CADENCE_CYCLE2_DAYS: "2"
          CADENCE_CYCLE4_DAYS: "1"
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python build_dmit_ports.py

      # 复用 DMIT 那个 masscan 脚本（名字带 dmit 但实现通用：
      # 目标/名字/端口全由 argv 传入）。rate 2000 —— 这六个 ASN 全属
      # 一家，11 万 IP 的流量全落在 xTom 身上，不像长尾线那样分摊。
      - name: Run Scan
        id: scan
        if: env.SHOULD_RUN == 'true'
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
          CHECK_API: ${{ secrets.CHECK_API }}
          MASK_PORT_LOG: "1"
          SCAN_DEADLINE_MIN: "300"
          MASSCAN_RATE: "2000"
          MASSCAN_RETRIES: "2"
          MASSCAN_WAIT: "5"
        run: |
          echo "[INFO] scan_target=${SCAN_TARGET} port_count=${MERGED_PORTS_COUNT} est=${EST_MINUTES}min"
          python check_cf_asn_masscan_dmit.py "${SCAN_TARGET}" "xTom" "${MERGED_PORTS}"

      # ASN 继承 build 写出的 SCAN_TARGET，不重复维护第二份列表 ——
      # 两处一旦不一致，缺失桶的 last_scanned 标不上，那些端口会被无限
      # 重选、轮转永不推进，且日志看不出异常。
      - name: Finalize port rotation
        if: env.SHOULD_RUN == 'true' && steps.scan.outcome == 'success'
        env:
          STATE_FILE: "dmit_ports_state.json"
          ASN: ${{ env.SCAN_TARGET }}
        run: python build_dmit_ports.py --finalize

      - name: Push port state (always)
        if: always()
        run: |
          test -d result_repo || exit 0
          test -f dmit_ports_state.json || exit 0

          cp dmit_ports_state.json result_repo/
          cd result_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dmit_ports_state.json

          if git diff --staged --quiet; then
            echo "no state change"
            exit 0
          fi

          git commit -m "auto: update xTom port rotation state"
          for i in 1 2 3 4 5; do
            git push && break
            echo "state push 冲突，第 $i 次重试..."
            if ! git pull --rebase origin main; then
              CONFLICTS=$(git diff --name-only --diff-filter=U)
              if [ -n "$CONFLICTS" ]; then
                for f in $CONFLICTS; do
                  case "$f" in
                    *.json) git checkout --theirs "$f" || true ;;
                    *)      sort -u "$f" -o "$f" ;;
                  esac
                  git add "$f"
                done
                GIT_EDITOR=true git rebase --continue || git rebase --abort
              else
                git rebase --abort 2>/dev/null || true
              fi
            fi
            sleep $((RANDOM % 10 + 5))
          done

      - name: Push result to private repo
        if: env.SHOULD_RUN == 'true' && steps.scan.outcome == 'success'
        run: |
          if [ ! -s xTom.txt ]; then
            echo "xTom.txt 不存在或为空，本次无结果，跳过推送"
            exit 0
          fi
          cp xTom.txt result_repo/

          cd result_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add xTom.txt
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi

          git commit -m "auto: update xTom"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push 冲突，第 $i 次重试..."
            if ! git pull --rebase origin main; then
              # .txt 结果文件是行集合、顺序无关，sort -u 取并集安全
              #（冲突通常来自 recheck 同时在刷 country / 剔除失效条目）
              CONFLICTS=$(git diff --name-only --diff-filter=U)
              ABORT=0
              if [ -n "$CONFLICTS" ]; then
                for f in $CONFLICTS; do
                  case "$f" in
                    *.txt)  sort -u "$f" -o "$f"; git add "$f" ;;
                    *.json) git checkout --theirs "$f" || true; git add "$f" ;;
                    *)      ABORT=1; break ;;
                  esac
                done
              fi
              if [ "$ABORT" = "1" ]; then
                git rebase --abort 2>/dev/null || true
              elif [ -n "$CONFLICTS" ]; then
                GIT_EDITOR=true git rebase --continue || git rebase --abort
              else
                git rebase --abort 2>/dev/null || true
              fi
            fi
            sleep $((RANDOM % 10 + 5))
          done

      - name: Cleanup local sensitive files
        if: always()
        run: |
          rm -f dmit_ports_state.json dmit_ports_pool.txt
          rm -f scan_done_ports.txt scan_metrics.json scan_truncated.txt
          rm -f scan_out_files.txt
          rm -rf .tmp

      - name: Notify TG
        if: always()
        run: |
          COUNT=$(cat count.txt 2>/dev/null || echo "?")
          TRUNC=$(cat scan_truncated.txt 2>/dev/null || echo "0")
          WARN=""
          [ "$TRUNC" = "1" ] && WARN="%0A⚠️ 本轮触及时间闸门，未扫全，剩余下轮优先补"

          if [ "${{ job.status }}" != "success" ]; then
            MSG="❌ 扫描失败%0A服务商: xTom (6 个 ASN)%0A状态: ${{ job.status }}"
          elif [ "${SHOULD_RUN:-false}" != "true" ]; then
            MSG="⏭️ 本次跳过%0A服务商: xTom (6 个 ASN)%0A端口档案: ${POOL_COUNT:-?}%0A阶段: ${SWEEP_PHASE:-?}（待覆盖 ${REMAINING_UNSCANNED:-?}）%0A间隔 ${CADENCE_DAYS:-?} 天"
          else
            MSG="✅ 扫描完成%0A服务商: xTom (6 个 ASN)%0A端口: ${MERGED_PORTS_COUNT:-?}（默认5 + 新扫 ${NEW_COUNT:-?} + 复扫 ${RESCAN_COUNT:-?}）%0A阶段: ${SWEEP_PHASE:-?}（池 ${POOL_COUNT:-?}，待覆盖 ${REMAINING_UNSCANNED:-?}）%0A轮转一圈 ${CYCLE_ROUNDS:-?} 轮 → 间隔 ${CADENCE_DAYS:-?} 天%0A本次新增: ${COUNT} 个${WARN}"
          fi

          RESP=$(curl -sS "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="${MSG}")

          case "$RESP" in
            *'"ok":true'*) : ;;
            *) echo "::error::TG 推送失败" ;;
          esac
