name: Scan xTom (AS3258)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 2'   # 每周二 UTC 03:00

concurrency:
  group: scan-xtom
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull old results
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Irreversibles/proxyip.git result_repo
          # 只拷自己的结果文件，避免 push 时把别人的旧副本推回去
          cp result_repo/xTom-jp.txt ./ 2>/dev/null || true

      - name: Run Scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
          CHECK_API: ${{ secrets.CHECK_API }}
        run: |
          python check_cf_asn.py "3258" "xTom-jp" "443,8443,2053,2083,2096"

      - name: Push result to private repo
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          if [ ! -s xTom-jp.txt ]; then
            echo "xTom-jp.txt 不存在或为空，本次无结果，跳过推送"
            exit 0
          fi
          cp xTom-jp.txt result_repo/

          cd result_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add xTom-jp.txt
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "auto: update xTom-jp"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push 冲突，第 $i 次重试..."
              if ! git pull --rebase origin main; then
                # rebase 冲突处理：
                #   .txt 结果文件是行集合、顺序无关，sort -u 取并集是安全的
                #   （冲突通常来自 recheck 同时在刷 country / 剔除失效条目）
                #   其他类型文件排序会破坏结构 → 放弃本次 rebase
                CONFLICTS=$(git diff --name-only --diff-filter=U)
                ABORT=0
                if [ -n "$CONFLICTS" ]; then
                  for f in $CONFLICTS; do
                    case "$f" in
                      *.txt)
                        echo "  合并冲突文件: $f"
                        sort -u "$f" -o "$f"
                        git add "$f"
                        ;;
                      *)
                        echo "  非文本文件冲突，放弃本次 rebase: $f"
                        ABORT=1
                        break
                        ;;
                    esac
                  done
                fi
                if [ "$ABORT" = "1" ]; then
                  git rebase --abort 2>/dev/null || true
                elif [ -n "$CONFLICTS" ]; then
                  GIT_EDITOR=true git rebase --continue || git rebase --abort
                else
                  git rebase --abort 2>/dev/null || true
                fi
              fi
              sleep $((RANDOM % 10 + 5))
            done
          fi

      - name: Notify TG
        if: always()
        run: |
          COUNT=$(cat count.txt 2>/dev/null || echo "?")
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ 扫描完成%0A服务商: xTom-jp%0A目标: AS3258%0A本次新增: ${COUNT} 个"
          else
            MSG="❌ 扫描失败%0A服务商: xTom-jp%0A目标: AS3258%0A状态: ${{ job.status }}"
          fi
          echo "发送内容: ${MSG}"
          RESP=$(curl -sS "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="${MSG}")
          echo "$RESP"
          case "$RESP" in
            *'"ok":true'*) : ;;
            *) echo "::error::TG 推送失败" ;;
          esac
