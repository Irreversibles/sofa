name: Traffic Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'   # 每天 UTC 12:00 —— 各扫描线之间的空档

concurrency:
  group: traffic-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 历史存私库：公开库里放访问统计等于告诉访客你在数他们
      - name: Pull history from private repo
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/Irreversibles/proxyip.git" \
            result_repo
          mkdir -p traffic
          cp result_repo/traffic/traffic_history.json traffic/ 2>/dev/null || true

      - name: Fetch traffic
        env:
          GH_TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
          WATCH_REPO: ${{ github.repository }}
          HISTORY_FILE: "traffic/traffic_history.json"
          CLONE_ALERT: "3"
          VIEW_RATIO: "2.0"
          VIEW_MIN: "5"
          BASELINE_DAYS: "7"
        run: python traffic_watch.py

      - name: Push history
        if: always()
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          test -f traffic/traffic_history.json || exit 0
          mkdir -p result_repo/traffic
          cp traffic/traffic_history.json result_repo/traffic/

          cd result_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add traffic/traffic_history.json

          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi

          git commit -m "traffic: update access history"
          for i in 1 2 3; do
            git push && break
            git pull --rebase --autostash || true
            sleep 5
          done

      - name: Notify TG
        if: always()
        run: |
          if [ -n "${TRAFFIC_ALERT}" ]; then
            MSG="${TRAFFIC_ALERT}"
          elif [ "${{ job.status }}" != "success" ]; then
            MSG="❌ Traffic 监控失败%0A状态: ${{ job.status }}"
          else
            exit 0    # 无异常不推送，避免每天噪音
          fi

          curl -sS "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="${MSG}" > /dev/null
