name: Collect Rebuild (no scan)

# ⚠️ 临时工具，勿加 schedule。
# dry_run=0 时会真实写 dmit_ports_state.json 并推私库；若被定时触发，
# 会和 Scan-DMIT.yml 争抢同一份 state（同文件 JSON 冲突，rebase 解不了）。
# 一次性重建端口档案用，确认 state 无误后可删掉本文件。

on:
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: '1=清空 count 全量重读（保留 last_scanned）'
        required: false
        default: '1'
      do_csv:
        description: '1=同时解析频道 CSV 附件'
        required: false
        default: '1'
      dry_run:
        description: '1=只看结果不写 state（先用 1 跑一遍最安全）'
        required: false
        default: '1'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install telethon

      - name: Pull private repo (state)
        env:
          RESULT_REPO_TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${RESULT_REPO_TOKEN}@github.com/Irreversibles/proxyip.git" \
            private_repo
          if [ -f private_repo/dmit_ports_state.json ]; then
            cp private_repo/dmit_ports_state.json ./dmit_ports_state.json
            echo "[*] 已拉取现有 state"
            python inspect_state.py ./dmit_ports_state.json || true
          else
            echo "[!] 私库没有 state，将新建"
          fi

      - name: Collect from TG group
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_B64: ${{ secrets.TG_SESSION_B64 }}
          TG_SOURCE_CHAT: ${{ secrets.TG_SOURCE_CHAT }}
          TG_SENDER: ${{ secrets.TG_SENDER }}
          STATE_FILE: "dmit_ports_state.json"
          OUT_FILE: "dmit_ports_pool.txt"
          TG_FETCH_LIMIT: "0"
          FULL_REBUILD: ${{ inputs.full_rebuild }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python collect_dmit_ports.py

      - name: Collect from channel CSV
        if: inputs.do_csv == '1'
        continue-on-error: true
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_B64: ${{ secrets.TG_SESSION_B64 }}
          TG_FILE_CHAT: ${{ secrets.TG_FILE_CHAT }}
          STATE_FILE: "dmit_ports_state.json"
          DRY_RUN: ${{ inputs.dry_run }}
        run: python collect_csv_ports.py

      # 只算不扫：看配额/cycle/cadence 是否合理
      - name: Build plan (dry, no scan)
        env:
          STATE_FILE: "dmit_ports_state.json"
          ASN: "906,32519"
          DEFAULT_PORTS: "443,8443,2053,2083,2096"
          SCAN_BUDGET_MIN: "170"
        run: python build_dmit_ports.py

      - name: Sanity check pool
        if: inputs.dry_run != '1'
        run: |
          echo "===== 端口池抽样（前 40 行）====="
          head -40 dmit_ports_pool.txt || true
          echo "===== 可疑端口检查 ====="
          python inspect_state.py ./dmit_ports_state.json --check-low

      - name: Push state to private repo
        if: inputs.dry_run != '1'
        run: |
          cp dmit_ports_state.json private_repo/
          cp dmit_ports_pool.txt private_repo/ 2>/dev/null || true
          cd private_repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dmit_ports_state.json dmit_ports_pool.txt
          if git diff --cached --quiet; then
            echo "[*] 无变化，跳过提交"
          else
            git commit -m "rebuild: port archive from TG group + channel CSV"
            for i in 1 2 3; do
              git pull --rebase && git push && break || sleep 5
            done
          fi

      - name: Cleanup
        if: always()
        run: rm -f tg_dmit_ports.session
