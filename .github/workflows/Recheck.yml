name: Recheck IPs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 */3 * *'   # 每3天一次，UTC 6点（北京14点）

concurrency:
  group: recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Pull results
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Irreversibles/proxyip.git result_repo
          shopt -s nullglob
          for f in result_repo/*.txt; do
            fn=$(basename "$f")
            case "$fn" in
              requirements.txt|ip.txt|count.txt|name.txt|recheck_summary.txt) continue ;;
            esac
            cp "$f" ./ 2>/dev/null || true
          done

      - name: Recheck
        run: |
          shopt -s nullglob
          FILES=""
          for f in *.txt; do
            case "$f" in
              requirements.txt|ip.txt|count.txt|name.txt|recheck_summary.txt) continue ;;
            esac
            FILES="$FILES $f"
          done
          echo "复验文件: $FILES"
          if [ -n "$FILES" ]; then
            python recheck_api.py $FILES
          else
            echo "没有可复验的文件"
          fi
          if [ -s recheck_summary.txt ]; then
            echo "剔除摘要："
            cat recheck_summary.txt
          fi

      - name: Push back
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          shopt -s nullglob
          for f in *.txt; do
            case "$f" in
              requirements.txt|ip.txt|count.txt|name.txt|recheck_summary.txt) continue ;;
            esac
            cp "$f" result_repo/ 2>/dev/null || true
          done

          cd result_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # 精确 add 结果文件，不用 git add -A。
          # -A 会把 clone 时拉到的旧副本一起提交，若期间有 scan workflow
          # 推了新结果，那份成果会被这里的旧副本覆盖回滚。
          shopt -s nullglob
          for f in *.txt; do
            case "$f" in
              requirements.txt|ip.txt|count.txt|name.txt|recheck_summary.txt) continue ;;
            esac
            git add "$f" || true
          done

          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "recheck: 剔除失效IP + 更新落地"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push 冲突，第 $i 次重试..."
              git pull --rebase --autostash || exit 1
              sleep $((RANDOM % 10 + 5))
            done
          fi

      - name: Notify TG
        if: always()
        run: |
          if [ -s recheck_summary.txt ]; then
            DETAILS=$(awk -F: '
              { total += $2; printf "  • %s：%s 个\n", $1, $2 }
              END { printf "合计剔除 %d 个", total }
            ' recheck_summary.txt)
            MSG=$(printf '🔄 大号复验完成，已剔除失效IP：\n%s' "$DETAILS")
          else
            if [ "${{ job.status }}" = "success" ]; then
              MSG="🔄 大号复验完成，无失效IP需剔除"
            else
              MSG=$(printf '❌ 大号复验失败\n状态: %s' "${{ job.status }}")
            fi
          fi
          curl -sS -X POST \
            "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TG_CHAT_ID }}" \
            --data-urlencode "text=${MSG}"
