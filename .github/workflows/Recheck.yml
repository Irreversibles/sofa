name: Recheck IPs

on:
  workflow_dispatch:
  schedule:
    # 每天触发，实际跑不跑由下面的 cadence 闸门按时间戳判定。
    # 不用 '*/3'：那在 day-of-month 里展开成固定日期 1,4,7,...,28,31，
    # 月末会重置 —— 31 号跑完 1 号又跑（隔 1 天），2 月更明显。
    # 而且 GitHub 高负载时会直接丢弃 scheduled 事件且不补偿，用 */3 被丢
    # 一次就要等到第 6 天。每天敲门 + 闸门放行，节奏才真正稳定在 3 天。
    # 分钟取 17 而非 0：整点是队列最拥挤的时刻，被丢概率明显更高。
    - cron: '17 6 * * *'

concurrency:
  group: recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read        # 只往私库推（用 RESULT_REPO_TOKEN），不写本库
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Pull results
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Irreversibles/proxyip.git result_repo
          shopt -s nullglob
          for f in result_repo/*.txt; do
            fn=$(basename "$f")
            case "$fn" in
              requirements.txt|ip.txt|count.txt|name.txt|recheck_summary.txt) continue ;;
            esac
            cp "$f" ./ 2>/dev/null || true
          done

      # 时间戳存私库 recheck_state.json（clone 时一并拉下，直接读 result_repo/）。
      # 只在复验成功后才更新，所以失败或被闸门跳过的轮次不推进节奏，第二天会重试。
      - name: Cadence gate
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          # 阈值取 66 小时而不是 72：GitHub 定时普遍延迟 20-40 分钟，若按 72
          # 卡死，上轮延迟到 06:45、本轮 06:20 触发就只有 71.6 小时 → 判跳过
          # → 顺延到第 4 天，之后每次往后漂。66 留足余量，实际间隔仍是 3 天。
          MIN_HOURS: '66'
        run: |
          python - <<'PY'
          import json, os, time
          force = os.environ.get("FORCE") == "1"
          min_h = float(os.environ.get("MIN_HOURS", "66"))
          try:
              with open("result_repo/recheck_state.json", encoding="utf-8") as f:
                  last = float(json.load(f).get("last_run_ts", 0))
          except Exception:
              last = 0.0
          elapsed = (time.time() - last) / 3600 if last else float("inf")
          run = force or elapsed >= min_h
          if last:
              print(f"[*] 距上次复验 {elapsed:.1f} 小时（阈值 {min_h}）")
          else:
              print("[*] 无历史记录，首次运行")
          print(f"[*] 本轮{'执行' if run else '跳过'}"
                f"{'（手动强制）' if force and elapsed < min_h else ''}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"SHOULD_RUN={'true' if run else 'false'}\n")
              f.write(f"ELAPSED_H={elapsed if last else -1:.1f}\n")
          PY

      - name: Recheck
        if: env.SHOULD_RUN == 'true'
        env:
          CHECK_API: ${{ secrets.CHECK_API }}
          # 比 job 的 120 分钟留 20 分钟余量：job 级 timeout 会取消整个 job，
          # 后续步骤即使 if: always() 也不执行，等于整轮结果全丢。
          RECHECK_DEADLINE_MIN: "100"
        run: |
          shopt -s nullglob
          # 必须用数组：结果文件名含空格（Dream Cloud.txt / Coaxial Cable.txt
          # / BACK WAVES.txt），拼成字符串后无引号展开会被按空格拆成多个参数，
          # 脚本只报"文件不存在"然后跳过 —— 这三个文件此前一直没被复验。
          FILES=()
          for f in *.txt; do
            case "$f" in
              requirements.txt|ip.txt|count.txt|name.txt|recheck_summary.txt) continue ;;
            esac
            FILES+=("$f")
          done
          echo "复验 ${#FILES[@]} 个文件"
          if [ ${#FILES[@]} -gt 0 ]; then
            python recheck_api.py "${FILES[@]}"
          else
            echo "没有可复验的文件"
          fi
          if [ -s recheck_summary.txt ]; then
            echo "剔除摘要（文件:剔除数:API异常数）："
            cat recheck_summary.txt
          fi

      - name: Stamp cadence state
        if: env.SHOULD_RUN == 'true' && success()
        run: |
          python -c "import json,time;json.dump({'last_run_ts':time.time()},open('result_repo/recheck_state.json','w'))"

      - name: Push back
        if: env.SHOULD_RUN == 'true'
        run: |
          shopt -s nullglob
          for f in *.txt; do
            case "$f" in
              requirements.txt|ip.txt|count.txt|name.txt|recheck_summary.txt|recheck_truncated.txt) continue ;;
            esac
            cp "$f" result_repo/ 2>/dev/null || true
          done

          cd result_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add recheck_state.json || true

          # 精确 add 结果文件，不用 git add -A。
          # -A 会把 clone 时拉到的旧副本一起提交，若期间有 scan workflow
          # 推了新结果，那份成果会被这里的旧副本覆盖回滚。
          shopt -s nullglob
          for f in *.txt; do
            case "$f" in
              requirements.txt|ip.txt|count.txt|name.txt|recheck_summary.txt) continue ;;
            esac
            git add "$f" || true
          done

          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "recheck: 剔除失效IP + 更新落地"
            # 这里不能用 sort -u 合并冲突：recheck 是要删行的，取并集
            # 会让刚剔除的失效条目复活。冲突就退出，下轮再来。
            for i in 1 2 3 4 5; do
              git push && break
              echo "push 冲突，第 $i 次重试..."
              git pull --rebase --autostash || exit 1
              sleep $((RANDOM % 10 + 5))
            done
          fi

      - name: Notify TG
        if: always()
        run: |
          TRUNC=$(cat recheck_truncated.txt 2>/dev/null || echo "0")
          WARN=""
          [ "$TRUNC" = "1" ] && WARN=$'\n⚠️ 触及时间闸门，剩余文件下轮继续'

          if [ "${SHOULD_RUN:-true}" != "true" ]; then
            # 每天触发但只有满 66 小时才复验，跳过是常态。
            # 不想每天收这条就把下面两行换成 exit 0。
            MSG=$(printf '⏭️ 复验跳过\n距上次 %s 小时，未满 3 天' "${ELAPSED_H}")
          elif [ "${{ job.status }}" != "success" ]; then
            MSG=$(printf '❌ 大号复验失败\n状态: %s' "${{ job.status }}")
          elif [ -s recheck_summary.txt ]; then
            DETAILS=$(awk -F: '
              { rm += $2; unk += $3
                if ($2 > 0)
                  printf "  • %s：剔除 %s 个%s\n", $1, $2, \
                         ($3 > 0 ? " (另 " $3 " 条API异常)" : "")
                else if ($3 > 0)
                  printf "  • %s：%s 条API异常待下轮\n", $1, $3
              }
              END {
                printf "合计剔除 %d 个", rm
                if (unk > 0) printf "，%d 条API异常待下轮", unk
              }
            ' recheck_summary.txt)
            MSG=$(printf '🔄 大号复验完成\n%s%s' "$DETAILS" "$WARN")
          else
            MSG=$(printf '🔄 大号复验完成，无失效IP需剔除%s' "$WARN")
          fi
          curl -sS -X POST \
            "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TG_CHAT_ID }}" \
            --data-urlencode "text=${MSG}"
