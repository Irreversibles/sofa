name: Recheck IPs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 */3 * *'   # 每3天一次，UTC 6点（北京14点）

concurrency:
  group: recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Pull results
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Irreversibles/proxyip.git result_repo
          shopt -s nullglob
          for f in result_repo/*.txt; do
            fn=$(basename "$f")
            case "$fn" in
              requirements.txt|ip.txt|count.txt|name.txt|recheck_summary.txt) continue ;;
            esac
            cp "$f" ./ 2>/dev/null || true
          done

      - name: Recheck
        run: |
          shopt -s nullglob
          FILES=""
          for f in *.txt; do
            case "$f" in
              requirements.txt|ip.txt|count.txt|name.txt|recheck_summary.txt) continue ;;
            esac
            FILES="$FILES $f"
          done
          echo "复验文件: $FILES"
          if [ -n "$FILES" ]; then
            python recheck_api.py $FILES
          else
            echo "没有可复验的文件"
          fi
          if [ -s recheck_summary.txt ]; then
            echo "剔除摘要："
            cat recheck_summary.txt
          fi

      - name: Push back
        env:
          TOKEN: ${{ secrets.RESULT_REPO_TOKEN }}
        run: |
          shopt -s nullglob
          for f in *.txt; do
            case "$f" in
              requirements.txt|ip.txt|count.txt|name.txt|recheck_summary.txt) continue ;;
            esac
